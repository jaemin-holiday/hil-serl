# IK retargeter config — RobotEra XHand1 (right URDF; left handled by Y-mirror).
#
# Hand of the RB-Y1 + XHand build (holiday PR #2342, rby1_xhand). 12 DoF:
# thumb 3 (bend = CMC abduction, rota1/rota2 = flexion), index 3 (bend =
# abduction, joint1/joint2 = flexion), mid/ring/pinky 2 each (flexion only,
# no abduction). URDF names are the vendor's, side-prefixed, so the emitted
# joint names are `right_hand_*` / `left_hand_*` with no remap.
#
# Paths are resolved relative to this file's parent (see IKConfig).

urdf_path: xhand_right.urdf
base_link: right_hand_link

# No wrist_calibration: the XHand base frame already matches the IK's
# wrist-local convention (+Z distal, +Y thumb side, +X palm) — verified by FK
# at zero config against friday_prod's base_link (same tip layout, see
# tests/test_xhand_ik.py).

# Middle-finger reach ≈ 0.206 m from the palm origin (0.108 + 0.056 + 0.042),
# human ≈ 0.17–0.19 m: hand of human scale → 1.0 to start (README rule).
human_hand_scale: 1.0

fingers:
  - name: thumb
    role: thumb
    tip_link: right_hand_thumb_rota_tip
    dip_link: right_hand_thumb_rota_link2
    joints:
      - right_hand_thumb_bend_joint
      - right_hand_thumb_rota_joint1
      - right_hand_thumb_rota_joint2

  - name: index
    role: primary
    tip_link: right_hand_index_rota_tip
    dip_link: right_hand_index_rota_link2
    joints:
      - right_hand_index_bend_joint
      - right_hand_index_joint1
      - right_hand_index_joint2

  - name: middle
    role: primary
    tip_link: right_hand_mid_tip
    dip_link: right_hand_mid_link2
    joints:
      - right_hand_mid_joint1
      - right_hand_mid_joint2

  - name: ring
    role: primary
    tip_link: right_hand_ring_tip
    dip_link: right_hand_ring_link2
    joints:
      - right_hand_ring_joint1
      - right_hand_ring_joint2

  - name: pinky
    role: primary
    tip_link: right_hand_pinky_tip
    dip_link: right_hand_pinky_link2
    joints:
      - right_hand_pinky_joint1
      - right_hand_pinky_joint2

weights:
  thumb_pos: 10.0
  fingertip_pos: 1.0
  pinch: 10.0
  fingertip_rot: 10.0
  joint_vel: 1.0e-2
  # Length = 12 (joint_order). Regularize the two abduction joints only.
  joint_pos:
    [ 0.05, 0.0, 0.0,   # thumb  bend, rota1, rota2
      0.05, 0.0, 0.0,   # index  bend, joint1, joint2
      0.0, 0.0,         # middle joint1, joint2
      0.0, 0.0,         # ring
      0.0, 0.0 ]        # pinky

pinch:
  thres_close: 0.01
  thres_far:   0.10
  steepness:   10.0

solver:
  ftol_abs:      1.0e-5
  maxtime:       0.0
  maxeval:       16
  limit_epsilon: 1.0e-3

output_filter:
  min_cutoff_hz: 1.5
  beta: 0.4
  derivative_cutoff_hz: 1.0
  reset_gap_s: 0.2
